<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Patient's Record</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%272%27 fill=%27%233a4651%27/%3E%3Crect x=%274%27 y=%273%27 width=%2712%27 height=%2714%27 fill=%27%23fffefb%27/%3E%3Crect x=%276%27 y=%276%27 width=%278%27 height=%271.8%27 fill=%27%2317191c%27/%3E%3Crect x=%276%27 y=%279.4%27 width=%275.5%27 height=%271.8%27 fill=%27%2317191c%27/%3E%3Crect x=%276%27 y=%2712.8%27 width=%277%27 height=%271.8%27 fill=%27%2317191c%27/%3E%3C/svg%3E">
<meta name="description" content="One patient's record with every value covered; choosing who read it lifts exactly the lines that run read. The copy that left the hospital, and its erasure; the record's access slip.">
<style>/*__CSS__*/</style>
</head>
<body data-leaf="1">
<div class="room">
  <header class="top">
    <h1>One patient's record</h1>
    <div class="conds">
      <label class="pick"><span class="pl">Job</span><select id="job" aria-label="Job"></select></label>
      <label class="pick"><span class="pl">Model</span><select id="model" aria-label="AI model, reader b"></select></label>
      <div class="pick seg" role="radiogroup" aria-label="What the AI model was told"><span class="pl" aria-hidden="true">Told</span><span class="opts" id="brief"></span></div>
    </div>
  </header>
  <main class="desk" id="desk">
    <div class="folder" id="folder">
      <nav class="tabs" id="tabs" aria-label="Read by"></nav>
      <div class="body">
        <div class="stack" id="stack" aria-hidden="true"></div>
        <article class="sheet" id="sheet" aria-live="polite"></article>
      </div>
    </div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </main>
  <footer class="foot">
    <div class="turn">
      <button class="key" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
      <button class="key next" id="next" type="button" aria-label="Next"><span>Next</span><kbd>Space</kbd></button>
    </div>
    <nav class="leaves" id="leaves" aria-label="Leaves"></nav>
    <p class="keys" aria-hidden="true"><kbd>a</kbd><kbd>b</kbd><kbd>c</kbd> reader <kbd>E</kbd> erase date <kbd>J</kbd> job <kbd>M</kbd> model <kbd>T</kbd> told</p>
  </footer>
</div>
<script type="application/json" id="record-data">/*__DATA__*/null</script>
<script>/*__JS__*/</script>
</body>
</html>
