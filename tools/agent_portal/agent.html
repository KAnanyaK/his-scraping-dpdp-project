<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIS Staff Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%274%27 fill=%27%2314315c%27/%3E%3Ccircle cx=%2710%27 cy=%276%27 r=%271.6%27 fill=%27%23fff%27/%3E%3Crect x=%278.6%27 y=%278.8%27 width=%272.8%27 height=%277.2%27 rx=%271.2%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<meta name="description" content="The HIS Staff Assistant: ask for a hospital system task in your own words, and watch the request walk its route, from understanding it, through the DPDP check for your role, to the screen and the button.">
<style>/*__CSS__*/</style>
</head>
<body data-role="reception">
<div class="app">
  <header class="band">
    <div class="brand">
      <span class="tile info" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#p-info"/></svg></span>
      <h1>HIS Staff Assistant</h1>
    </div>
    <nav class="badges" id="badges" aria-label="Staff badge"></nav>
    <div class="tours">
      <button class="tour-btn" id="tour" type="button" aria-describedby="tourFor"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#p-play"/></svg><span>Tour</span><span class="for" id="tourFor"></span></button>
    </div>
  </header>

  <main class="floor">
    <section class="desk" aria-label="Enquiry desk">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="tasks" id="tasks"></div>
      <form class="ask" id="ask" autocomplete="off">
        <label class="sr-only" for="input">Ask the assistant</label>
        <input id="input" type="text" placeholder="Ask for an HIS task, in your own words" spellcheck="false">
        <button class="send" id="send" type="submit"><span>Ask</span><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#p-arrow"/></svg></button>
      </form>
    </section>

    <section class="route" aria-label="How the assistant handled the request">
      <ol class="stages" id="stages"></ol>
      <div class="board" id="board" aria-live="polite"></div>
      <figure class="screen" id="screen" aria-label="The HIS screen"></figure>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<svg class="sprites" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="p-info" viewBox="0 0 24 24"><circle cx="12" cy="6.4" r="1.9" fill="currentColor" stroke="none"/><path d="M12 10.6v8.2"/></symbol>
    <symbol id="p-desk" viewBox="0 0 24 24"><path d="M4.5 18.5h15M6 18.5v-6h12v6M8.5 12.5V9a3.5 3.5 0 0 1 7 0v3.5"/></symbol>
    <symbol id="p-door" viewBox="0 0 24 24"><path d="M6.5 20V4.5h9.5V20M4.5 20h15M13.4 12.4v.2"/><path d="M16 7.5l2.5-1v13"/></symbol>
    <symbol id="p-form" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16" rx="1.5"/><path d="M9 4.5V3.5h6v1M8.5 10h7M8.5 13.5h7M8.5 17h4"/></symbol>
    <symbol id="p-signpost" viewBox="0 0 24 24"><path d="M12 3.5v17M12 5.5h6.5l2 2.2-2 2.3H12M12 12h-6.5l-2 2.2 2 2.3H12"/></symbol>
    <symbol id="p-screen" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="11.5" rx="1.5"/><path d="M9 20h6M12 16v4"/></symbol>
    <symbol id="p-arrow" viewBox="0 0 24 24"><path d="M4.5 12h14M13.5 6.5 19 12l-5.5 5.5"/></symbol>
    <symbol id="p-check" viewBox="0 0 24 24"><path d="M5 12.5l4.4 4.4L19 7.3"/></symbol>
    <symbol id="p-noentry" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M7.4 12h9.2" stroke-width="3"/></symbol>
    <symbol id="p-question" viewBox="0 0 24 24"><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.9v.6"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="p-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="p-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="p-badge" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16" rx="2"/><path d="M10 4.5v2h4v-2"/><circle cx="12" cy="11.5" r="2.3"/><path d="M8.6 17.2a3.6 3.6 0 0 1 6.8 0"/></symbol>
    <symbol id="p-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-11a6.5 6.5 0 0 0-13 0c0 5 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <!-- the five departments -->
    <symbol id="d-patient_administration" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12.5" rx="1.5"/><circle cx="9" cy="11.2" r="2"/><path d="M5.9 16a3.3 3.3 0 0 1 6.2 0M14 10.5h4M14 13.5h4"/></symbol>
    <symbol id="d-clinical_ehr" viewBox="0 0 24 24"><path d="M12 19.5s-7-4.4-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.1c0 5-7 9.4-7 9.4z"/><path d="M7.2 12.4h2.6l1.4-2.2 1.8 4 1.3-1.8h2.5"/></symbol>
    <symbol id="d-ancillary_departmental" viewBox="0 0 24 24"><path d="M9.5 3.5h5M10.5 3.5v6L5.8 18.2A1.5 1.5 0 0 0 7.1 20.5h9.8a1.5 1.5 0 0 0 1.3-2.3L13.5 9.5v-6M8 14.5h8"/></symbol>
    <symbol id="d-administrative_financial" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-2.2-1.4-2.1 1.4-2.2-1.4-2.2 1.4-2.3-1.4z"/><path d="M9.5 8h5M9.5 11.5h5M9.5 15h3"/></symbol>
    <symbol id="d-infrastructure_integration" viewBox="0 0 24 24"><path d="M12 3.5l7 2.6v5.2c0 4.2-2.9 7.6-7 9.2-4.1-1.6-7-5-7-9.2V6.1z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/></symbol>
  </defs>
</svg>

<script type="application/json" id="agent-data">/*__DATA__*/null</script>
<script>/*__JS__*/</script>
</body>
</html>
