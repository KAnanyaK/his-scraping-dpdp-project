<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue of a Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 fill=%27%23ffffff%27/%3E%3Crect x=%272.5%27 y=%273%27 width=%278.5%27 height=%2714%27 fill=%27%23e6e9ea%27/%3E%3Cpath d=%27M13.5 6h4M13.5 9h4M13.5 12h2.5%27 stroke=%27%2315181a%27 stroke-width=%271.4%27/%3E%3C/svg%3E">
<meta name="description" content="The recorded DPDP extraction run, catalogued: for each job, the objects every technique left behind, a plate at a time, each with its catalogue entry.">
<style>/*__CSS__*/</style>
</head>
<body data-comp="cover">
<div class="book">
  <header class="head">
    <div class="title">
      <svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><rect class="m-plate" x="2" y="3" width="9" height="16"/><path class="m-text" d="M14 7h6M14 11h6M14 15h3.5"/></svg>
      <h1>Catalogue of a run</h1>
      <span class="rec" id="rec"></span>
    </div>
    <div class="picks">
      <label class="pick"><span class="pl">Job</span><select id="job" aria-label="Job"></select></label>
      <label class="pick"><span class="pl">Model</span><select id="model" aria-label="AI model shown as comparandum b"></select></label>
      <div class="pick seg" role="radiogroup" aria-label="What the AI model was told"><span class="pl" aria-hidden="true">Told</span><span class="opts" id="brief"></span></div>
    </div>
  </header>
  <main class="spread" id="spread">
    <div class="vol" id="vol">
      <figure class="page left" id="left" aria-live="polite">
        <div class="plate" id="plate"></div>
        <figcaption class="cap" id="cap"></figcaption>
      </figure>
      <article class="page right" id="right" aria-live="polite"></article>
    </div>
  </main>
  <footer class="foot">
    <div class="turn">
      <button class="key" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
      <button class="key next" id="next" type="button" aria-label="Next"><span>Next</span><kbd>Space</kbd></button>
    </div>
    <nav class="index" id="index" aria-label="Plates"></nav>
    <p class="keys" aria-hidden="true"><kbd>a</kbd><kbd>b</kbd><kbd>c</kbd> comparanda <kbd>J</kbd> job <kbd>M</kbd> model <kbd>T</kbd> told</p>
  </footer>
</div>
<script type="application/json" id="catalogue-data">/*__DATA__*/null</script>
<script>/*__JS__*/</script>
</body>
</html>
