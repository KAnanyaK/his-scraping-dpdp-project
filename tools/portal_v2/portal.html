<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Live Flow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%275%27 fill=%27%23070a12%27/%3E%3Ccircle cx=%275%27 cy=%276%27 r=%271.6%27 fill=%27%232ee6c9%27/%3E%3Ccircle cx=%2710%27 cy=%2710%27 r=%271.6%27 fill=%27%23ff5cae%27/%3E%3Ccircle cx=%2715%27 cy=%2714%27 r=%271.6%27 fill=%27%23ff9d4d%27/%3E%3C/svg%3E">
<meta name="description" content="The recorded DPDP extraction run as a live data flow: every value each technique reads leaves the hospital as a particle and travels through the rules, the export and the erasure.">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8"/><path class="m1" d="M7 9.5h9"/><path class="m2" d="M7 14h14"/><path class="m3" d="M7 18.5h6"/></svg>
      <span class="nm">DPDP Pipeline</span>
    </div>
    <div class="status ready" id="status" role="status" aria-live="polite"><i aria-hidden="true"></i><span>Ready</span></div>
    <div class="ctl">
      <label class="pick"><span class="rd b" aria-hidden="true">B</span><select id="model" aria-label="The AI model on lane B"></select></label>
      <div class="seg" id="brief" role="radiogroup" aria-label="What the AI model was told"></div>
    </div>
  </header>
  <div class="jobbar">
    <nav class="jobs" id="jobs" role="tablist" aria-label="Job"></nav>
    <div class="purpose" id="purpose"></div>
  </div>
  <main class="stage" id="stage">
    <section class="hosp" aria-label="The hospital">
      <div class="hh"><h2>Hospital</h2><span class="hs" id="hosp-sub"></span><span class="disc" id="disc"></span></div>
      <div class="mods" id="mods"></div>
      <div class="matrix" id="matrix"></div>
      <div class="work" id="work" aria-label="The working: this station's calculation" aria-live="off"></div>
    </section>
    <section class="gate" id="gate" aria-label="The gate">
      <div class="gbar"><span class="glock" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg></span></div>
      <ul class="checks" id="checks"></ul>
    </section>
    <section class="lanes" id="lanes" aria-label="Three techniques"></section>
    <canvas id="fx" aria-hidden="true"></canvas>
  </main>
  <footer class="transport" id="transport"></footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="application/json" id="flow-data">/*__DATA__*/null</script>
<script>/*__JS__*/</script>
</body>
</html>
