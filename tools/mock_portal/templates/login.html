{% extends "base.html" %}
{% block title %}Sign in - HIS Portal{% endblock %}
{% block body_class %}view-login{% endblock %}
{% block frame %}
<main class="logon">
  <div class="titlebar"><span class="brand"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="16.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 4.5v9M12.5 4.5v9M5.5 9h7" fill="none" stroke="currentColor" stroke-width="2"/></svg>HIS Portal <small>Hospital Information System</small></span></div>
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    <h1>Sign in</h1>
    {% if error %}<p class="error" role="alert"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2v.1"/></svg>{{ error }}</p>{% endif %}
    <input type="hidden" name="_token" value="{{ token }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p class="note"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>Authorised staff only. Access is logged.</p>
</main>
{% endblock %}
