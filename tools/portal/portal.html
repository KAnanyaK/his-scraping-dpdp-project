<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Line Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%275%27 fill=%27%230b1f3a%27/%3E%3Cpath d=%27M3 6h14%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke=%27%2300a091%27/%3E%3Cpath d=%27M3 10h14%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke=%27%23d1006f%27/%3E%3Cpath d=%27M3 14h14%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke=%27%23f28c00%27/%3E%3C/svg%3E">
<meta name="description" content="The recorded DPDP extraction pipeline as a metro map: three lines through the same stations, each calling at one stop per page it loaded.">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7"/><path class="la" d="M6 9h16"/><path class="lb" d="M6 14h16"/><path class="lc" d="M6 19h16"/></svg><span class="nm">Pipeline Line Map</span><span class="sub" id="sub"></span></div>
    <div class="status ready" id="status" role="status" aria-live="polite"><i aria-hidden="true"></i><span>Ready</span></div>
    <div class="lines" id="lines" role="group" aria-label="Lines"></div>
    <div class="briefing"><span class="bl" id="brief-l">Line B was told</span><div class="brief" id="brief" role="radiogroup" aria-labelledby="brief-l"></div></div>
  </header>
  <main class="stage">
    <section class="map" aria-label="The pipeline as a metro map"><svg id="map" role="img" aria-label="Three lines through seven stations"></svg></section>
    <aside class="ticket" id="ticket" aria-label="One patient's journey"></aside>
  </main>
  <footer class="route" id="route" aria-label="Stations"></footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="application/json" id="plant-data">/*__DATA__*/null</script>
<script>/*__JS__*/</script>
</body>
</html>
